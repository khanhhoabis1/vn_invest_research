name: Kiem dinh spec va ma nguon

# Cong CI: khong cho merge neu spec sai hoac ma nguon hong.
# Chay tren Ubuntu (khong dung Docker) de nhanh — Docker chi dung khi phat trien cuc bo.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Kiem dinh spec (REQ/COMP/TASK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cai thu vien kiem dinh
        run: pip install --quiet pyyaml jsonschema

      - name: Moi spec phai hop le voi JSON Schema
        run: python tools/spec_validate.py

      - name: Chi muc spec phai dong bo (khong duoc sua tay)
        run: |
          python tools/specctl.py index
          if ! git diff --quiet specs/SPEC-INDEX.md; then
            echo "::error::SPEC-INDEX.md khong khop. Chay 'python tools/specctl.py index' roi commit lai."
            git diff --stat specs/SPEC-INDEX.md
            exit 1
          fi
          echo "Chi muc spec dong bo."

  code:
    name: Lint va kiem tra ma nguon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cai cong cu
        run: pip install --quiet ruff

      - name: Ruff — bat loi that su
        run: ruff check vnir/ tools/ --output-format=github

      - name: Moi file Python phai bien dich duoc
        run: python -m compileall -q vnir tools

      - name: Canh bao neu package trung ten module chuan
        run: |
          # Bai hoc that: package ten 'platform' tung lam hong platform.system()
          for name in platform types json io code test string; do
            if [ -d "$name" ]; then
              echo "::error::Thu muc '$name' trung ten module chuan cua Python."
              exit 1
            fi
          done
          echo "Khong co xung dot ten module."

  docker:
    name: Docker image phai build duoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (khong day len registry)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vnir-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import chinh phai chay duoc trong image
        run: |
          docker run --rm vnir-api:ci python -c "
          import vnir.api.main
          from vnir.connectors.registry import discover
          d = discover()
          print(f'Nap duoc {len(d)} connector: {list(d)}')
          assert d, 'Khong nap duoc connector nao — kiem tra registry.py'
          "

  commit-trailer:
    name: Commit phai co Task-Id hoac Req-Id
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiem tra trailer truy vet
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            msg=$(git log -1 --format=%B "$sha")
            subject=$(git log -1 --format=%s "$sha")
            # Bo qua commit merge va commit chore/docs
            case "$subject" in
              Merge*|chore:*|docs:*) continue ;;
            esac
            if ! echo "$msg" | grep -qE '^(Task-Id|Req-Id):[[:space:]]*(TASK|REQ)-[0-9]{4}'; then
              echo "::warning::Commit $sha thieu trailer Task-Id/Req-Id: $subject"
              bad=$((bad+1))
            fi
          done < <(git rev-list "$base".."$head")
          if [ "$bad" -gt 0 ]; then
            echo "$bad commit thieu trailer truy vet (canh bao, chua chan merge)."
          else
            echo "Moi commit deu truy vet duoc ve spec."
          fi
