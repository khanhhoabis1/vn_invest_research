name: vnir-uat

x-common: &common
  restart: unless-stopped
  env_file: [.env]

services:

  # ---------------------------------------------------------------- metadata store
  db:
    <<: *common
    image: postgres:16-alpine          # PostgreSQL License (open source)
    container_name: vnir-uat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnir_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vnir}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["5451:5432"]
    volumes:
      - vnir-uat_pgdata:/var/lib/postgresql/data
      - ./vnir/db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnir} -d ${POSTGRES_DB:-vnir}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- API
  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vnir-uat-api
    image: ${UAT_IMAGE:-vnir-api:${UAT_TAG:-v0.1.0}}
    command: >
      python -m uvicorn vnir.api.main:app
      --host 0.0.0.0 --port 8000 --workers 1
    ports: ["8650:8000"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
    mem_limit: 768m
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------- worker + scheduler
  worker:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vnir-uat-worker
    image: ${UAT_IMAGE:-vnir-api:${UAT_TAG:-v0.1.0}}
    command: ["python", "-m", "vnir.worker.main"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
    mem_limit: 1g
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_started}

  # ---------------------------------------------------------------- UI nhom A: Build plane
  ui-build:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vnir-uat-ui-build
    image: ${UAT_IMAGE_UI:-vnir-ui-build:${UAT_TAG:-v0.1.0}}
    command: >
      streamlit run vnir/ui_build/app.py
      --server.port=8601 --server.address=0.0.0.0
      --server.headless=true --browser.gatherUsageStats=false
    ports: ["8651:8601"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
    mem_limit: 512m
    depends_on:
      api: {condition: service_started}

  # ---------------------------------------------------------------- UI nhom B: Ops plane
  ui-ops:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vnir-uat-ui-ops
    image: ${UAT_IMAGE_UI:-vnir-ui-build:${UAT_TAG:-v0.1.0}}
    command: >
      streamlit run vnir/ui_ops/app.py
      --server.port=8602 --server.address=0.0.0.0
      --server.headless=true --browser.gatherUsageStats=false
    ports: ["8652:8602"]
    volumes:
      - ./:/workspace
    working_dir: /workspace
    mem_limit: 640m
    depends_on:
      api: {condition: service_started}

volumes:
  vnir-uat_pgdata:
